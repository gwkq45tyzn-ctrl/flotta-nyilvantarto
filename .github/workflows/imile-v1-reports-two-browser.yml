name: iMile V1 #156 Fleet Depot In-Hub two-browser QA
on:
  pull_request:
    paths:
      - 'staging/imile-management/fleet/v1-reports-two-browser.e2e.mjs'
      - 'staging/imile-management/reports/report-core.mjs'
      - 'staging/imile-management/reports/report-core.test.mjs'
      - 'staging/imile-management/reports/report-statistics.mjs'
      - 'staging/imile-management/reports/report-statistics.test.mjs'
      - 'staging/imile-management/reports/inventory-statistics.mjs'
      - 'staging/imile-management/reports/inventory-statistics.test.mjs'
      - 'staging/imile-management/reports/report-app.mjs'
      - 'depokapacitas/capacity-eligibility.mjs'
      - 'depokapacitas/app.js'
      - 'features/firestore-bridge.js'
      - '.github/workflows/imile-v1-reports-two-browser.yml'
permissions:
  contents: read
jobs:
  reports-two-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Offline report date and capacity checks
        run: |
          node staging/imile-management/reports/report-core.test.mjs
          node staging/imile-management/reports/report-statistics.test.mjs
          node staging/imile-management/reports/inventory-statistics.test.mjs
          node depokapacitas/capacity-eligibility.test.mjs
          node features/s7-projection-contract.test.mjs
      - name: Install pinned SDK and free Chromium
        run: |
          npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
          npm install --prefix staging/imile-management/fleet --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.0
          ./staging/imile-management/fleet/node_modules/.bin/playwright install --with-deps chromium
      - name: Two Chromium sessions, Fleet to Depot to In-Hub
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-reports-two-browser.e2e.mjs"
