name: iMile V1 – P0 post-cutover legacy Fleet SDK hard-stop
on:
  pull_request:
    paths:
      - 'depokapacitas/firestore-v1-restricted.rules'
      - 'staging/imile-management/fleet/v1-post-cutover-legacy-write-hardstop-emulator.mjs'
      - '.github/workflows/imile-v1-post-cutover-p0.yml'
permissions:
  contents: read
jobs:
  actual-full-rules-legacy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firebase SDK test dependencies
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Real Firebase Emulator – old Fleet arrays and full document writes MUST DENY after keyed migration
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-post-cutover-legacy-write-hardstop-emulator.mjs"
      - name: No live deployment and no real data
        run: echo 'Synthetic local emulator only. This test is not release GO.'
