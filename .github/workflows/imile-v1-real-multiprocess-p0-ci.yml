name: iMile V1 #220 real two-OS-process epoch fencing + full source pin contract
on:
  pull_request:
    paths:
      - 'tools/v1-authenticated-source-contract.mjs'
      - 'tools/v1-authenticated-source-contract.test.mjs'
      - 'tools/v1-stale-writer-multiprocess.test.mjs'
      - 'staging/imile-management/fleet/v1-multiprocess-test-fixture.mjs'
      - 'staging/imile-management/fleet/v1-stale-writer-os-worker.mjs'
      - 'staging/imile-management/fleet/v1-stale-writer-multiprocess.test.mjs'
      - '.github/workflows/imile-v1-real-multiprocess-p0-ci.yml'
permissions:
  contents: read
jobs:
  independently-pinned-source-negative-and-positive:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Original trusted backup + identity + pin no false IAM/signer claims
        run: |
          git rev-parse HEAD
          node --check tools/v1-authenticated-source-contract.mjs
          node --test tools/v1-authenticated-source-contract.test.mjs \
            tools/v1-pinned-backup-trust.test.mjs \
            tools/v1-privileged-importer-local.test.mjs
  real-separate-node-processes-and-actual-original-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Locked demo SDK only
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Original Rules + truly distinct Node OS PIDs and Firestore epoch transactions
        run: |
          git rev-parse HEAD
          node --check staging/imile-management/fleet/v1-stale-writer-os-worker.mjs
          node --check staging/imile-management/fleet/v1-stale-writer-multiprocess.test.mjs
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-v1-two-process-stale \
            --config firebase.depo-qa.json \
            "node --test tools/v1-stale-writer-multiprocess.test.mjs"
      - name: No production source/IAM or release authority
        run: echo "LOCAL DEMO ONLY - no authenticated external source origin, no real IAM, no seal, no deployed write. Original full V1 P0 remains RED."
