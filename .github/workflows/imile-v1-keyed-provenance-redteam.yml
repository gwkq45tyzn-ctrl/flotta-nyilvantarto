name: iMile V1 – P0 canonical keyed provenance direct SDK RED TEAM
on:
  pull_request:
    paths:
      - 'depokapacitas/firestore-v1-restricted.rules'
      - 'staging/imile-management/fleet/v1-keyed-provenance-redteam.mjs'
      - '.github/workflows/imile-v1-keyed-provenance-redteam.yml'
permissions:
  contents: read
jobs:
  deny-forged-keyed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned SDK test dependencies
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Authenticated real Rules emulator security acceptance
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-keyed-provenance-redteam.mjs"
      - name: No production deployment
        run: echo 'Synthetic local emulator only; RED is a release blocker, NEVER a deploy approval.'
