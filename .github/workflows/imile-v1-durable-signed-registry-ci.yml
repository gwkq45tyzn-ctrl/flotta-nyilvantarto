name: iMile V1 #238 real durable signed-registry highwater 2 Node OS processes and privileged bypass
on:
  pull_request:
    paths:
      - 'tools/v1-durable-registry-antirollback.mjs'
      - 'tools/v1-durable-registry-antirollback.test.mjs'
      - 'staging/imile-management/fleet/v1-local-durable-signed-registry.mjs'
      - 'staging/imile-management/fleet/v1-registry-highwater-os-worker.mjs'
      - 'staging/imile-management/fleet/v1-local-durable-signed-registry.test.mjs'
      - '.github/workflows/imile-v1-durable-signed-registry-ci.yml'
permissions:
  contents: read
jobs:
  signed-chain-and-non-authoritative-caller-highwater:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full local crypto chain and offline caller high-water hard-stop
        run: |
          git rev-parse HEAD
          node --check tools/v1-durable-registry-antirollback.mjs
          node --test tools/v1-durable-registry-antirollback.test.mjs \
            tools/v1-trusted-signer-contract.test.mjs \
            tools/v1-orphan-inventory.test.mjs
  actual-two-three-os-processes-signed-registry-transaction-and-privileged-bypass:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact synthetic Firebase SDK dependencies, no postinstall
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Mandatory original Rules and shared DEMO Firestore transaction, true separate OS Node child processes
        run: |
          git rev-parse HEAD
          node --check staging/imile-management/fleet/v1-local-durable-signed-registry.mjs
          node --check staging/imile-management/fleet/v1-registry-highwater-os-worker.mjs
          node --check staging/imile-management/fleet/v1-local-durable-signed-registry.test.mjs
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-v1-registry-highwater \
            --config firebase.depo-qa.json \
            "node --test staging/imile-management/fleet/v1-local-durable-signed-registry.test.mjs"
      - name: Scope note
        run: echo "This test intentionally PROVES privileged Admin SDK bypass can rollback synthetic highwater. Signed root is locally self-selected; no production owner IAM or release seal. Full V1 remains NO-GO."
