name: iMile V1 #213 corrected fenced keyed master and claim readback
on:
  pull_request:
    paths:
      - 'tools/v1-keyed-write-readback.test.mjs'
      - 'staging/imile-management/fleet/v1-fenced-rich-keyed-importer.mjs'
      - 'staging/imile-management/fleet/v1-fenced-rich-keyed-importer.test.mjs'
      - '.github/workflows/imile-v1-fenced-keyed-readback-qa.yml'
permissions:
  contents: read
jobs:
  actual-rules-and-epoch-fenced-keyed-rich-claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Local SDK lockfile
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Real full restricted Firestore Rules, rich keyed+claims, source poisoning, epoch and rollback
        run: |
          git rev-parse HEAD
          node --check tools/v1-keyed-write-readback.test.mjs
          node --check staging/imile-management/fleet/v1-fenced-rich-keyed-importer.mjs
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-v1-rich-keyed \
            --config firebase.depo-qa.json \
            "node --test tools/v1-keyed-write-readback.test.mjs"
      - name: Proof limitation
        run: echo "Synthetic emulator withSecurityRulesDisabled is NOT real production IAM/source provenance. No release, real records or seal."
