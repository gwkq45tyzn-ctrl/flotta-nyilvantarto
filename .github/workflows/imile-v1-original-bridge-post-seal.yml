name: iMile V1 – P0 original Fleet bridge post-seal E2E SDK
on:
  pull_request:
    paths:
      - 'features/firestore-bridge.js'
      - 'depokapacitas/firestore-v1-restricted.rules'
      - 'staging/imile-management/fleet/v1-original-bridge-sealed-write-emulator.mjs'
      - '.github/workflows/imile-v1-original-bridge-post-seal.yml'
permissions:
  contents: read
jobs:
  original-bridge-local-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned authenticated SDK emulator dependencies
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Execute ORIGINAL Fleet bridge against full real restricted Rules
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-original-bridge-sealed-write-emulator.mjs"
      - name: No deployment
        run: echo 'Local synthetic SDK and original source only. NOT production approval.'
