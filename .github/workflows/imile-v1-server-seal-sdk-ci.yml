name: iMile V1 #229 server seal boundary real SDK TOCTOU NO-SEAL proof
on:
  pull_request:
    paths:
      - 'tools/v1-server-seal-boundary.mjs'
      - 'tools/v1-server-seal-boundary.test.mjs'
      - 'staging/imile-management/fleet/v1-local-keyed-namespace-inventory.test.mjs'
      - 'staging/imile-management/fleet/v1-scaled-fenced-rich-migration.test.mjs'
      - '.github/workflows/imile-v1-server-seal-sdk-ci.yml'
permissions:
  contents: read
jobs:
  fake-root-iam-scan-cannot-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline forged authority and source/inventory negative gates
        run: |
          git rev-parse HEAD
          node --check tools/v1-server-seal-boundary.mjs
          node --test tools/v1-server-seal-boundary.test.mjs \
            tools/v1-atomic-preseal-and-trustroot.test.mjs \
            tools/v1-orphan-inventory.test.mjs
  original-rules-real-firestore-sdk-3-rich-pairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Genuine original Rules with actual orphan AFTER successful review
        run: |
          git rev-parse HEAD
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-v1-inventory-parity \
            --config firebase.depo-qa.json \
            "node --test staging/imile-management/fleet/v1-local-keyed-namespace-inventory.test.mjs"
  actual-440-rich-master-claim-stale-green-scan-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: 440 actual rich keyed masters + claims and privileged late orphan after clean scan
        run: |
          git rev-parse HEAD
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-v1-scaled-rich \
            --config firebase.depo-qa.json \
            "node --test tools/v1-scaled-fenced-migration.test.mjs"
      - name: Scope of proof
        run: echo "No production trusted server seal or closed privileged writer set. Firestore four-collection scan not atomic. Original V1 poisoned-source P0 remains blocking RED."
