name: iMile V1 #186 original stale vs integrated Fleet no-network browser test
on:
  pull_request:
    paths:
      - 'staging/imile-management/fleet/v1-legacy-network-intercept.e2e.mjs'
      - '.github/workflows/imile-v1-legacy-network-intercept.yml'
permissions:
  contents: read
jobs:
  stale-original-vs-integrated-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline only browser dependencies
        run: |
          npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
          npm install --prefix staging/imile-management/fleet --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.0
          ./staging/imile-management/fleet/node_modules/.bin/playwright install --with-deps chromium
      - name: Exact original HTML stale mock POST vs real bridge legacy denial
        run: |
          node --check staging/imile-management/fleet/v1-legacy-network-intercept.e2e.mjs
          node staging/imile-management/fleet/v1-legacy-network-intercept.e2e.mjs
      - name: Real deployment status remains unknown
        run: echo "All requests intercepted locally, no live Google access, cutover remains NO-GO"
