name: iMile V1 P0 #133 actual atomic booking-index and claim forgery RED TEAM
on:
  pull_request:
    paths:
      - 'staging/imile-management/fleet/v1-forged-booking-index-probes.mjs'
      - 'depokapacitas/firestore-v1-restricted.rules'
      - '.github/workflows/imile-v1-forged-booking-index-redteam.yml'
permissions:
  contents: read
jobs:
  signed-in-atomic-booking-attacks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install lockfile-pinned original Firebase SDK test dependencies
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Validate actual hostile SDK source syntax
        run: node --check staging/imile-management/fleet/v1-forged-booking-index-probes.mjs
      - name: REAL restricted Rules — positive legal atomic booking then poisoned index / claim forgery negative attacks (expected RED until fixed)
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-forged-booking-index-probes.mjs"
      - name: No production effects
        run: echo "Local demo Firestore emulator only; no hosting deploy, real data or IAM changes"
