name: iMile V1 exact-SHA signed 440 full-rich 19-chunk receipt and privileged attack
on:
  pull_request:
    paths:
      - 'tools/v1-440-signed-receipt.mjs'
      - 'tools/v1-440-signed-receipt.test.mjs'
      - 'staging/imile-management/fleet/v1-local-440-signed-chunk-receipts.mjs'
      - 'staging/imile-management/fleet/v1-scaled-fenced-rich-migration.test.mjs'
      - '.github/workflows/imile-v1-signed-440-receipt-ci.yml'
permissions:
  contents: read
jobs:
  original-local-signed-source-and-fake-iam-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact HEAD, fake IAM and source signature negative controls
        run: |
          git rev-parse HEAD
          node --check tools/v1-440-signed-receipt.mjs
          node --check tools/v1-440-signed-receipt.test.mjs
          node --check staging/imile-management/fleet/v1-local-440-signed-chunk-receipts.mjs
          node --test tools/v1-440-signed-receipt.test.mjs \
            tools/v1-trusted-signer-contract.test.mjs \
            tools/v1-signed-source-highwater.test.mjs
  original-rules-real-440-rich-signed-chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Locked local synthetic Firebase SDK
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Genuine original restricted Rules, 440 rich master+claims, 19 signed-source registry/fencing receipts and attacked aggregate
        run: |
          git rev-parse HEAD
          node --check staging/imile-management/fleet/v1-scaled-fenced-rich-migration.test.mjs
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-v1-scaled-rich \
            --config firebase.depo-qa.json \
            "node --test tools/v1-scaled-fenced-migration.test.mjs"
      - name: Safety
        run: echo "NO REAL ROOT/IAM/SEAL. Out-of-band privileged reset can accept revoked signer. Original poisoned-source P0 remains RED."
