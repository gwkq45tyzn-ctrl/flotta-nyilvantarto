name: iMile V1 – #133 #141 authenticated preseal normalized-identity RED TEAM
on:
  pull_request:
    paths:
      - 'depokapacitas/firestore-v1-restricted.rules'
      - 'staging/imile-management/fleet/v1-preseal-adversarial-sdk.mjs'
      - 'staging/imile-management/fleet/v1-preseal-real-identity-redteam.mjs'
      - '.github/workflows/imile-v1-preseal-identity-redteam.yml'
permissions:
  contents: read
jobs:
  negative-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install existing lockfile pinned Firestore test libraries
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Grok preliminary P0 tests — same full restricted Rules
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-preseal-adversarial-sdk.mjs"
      - name: P0 REAL DUPLICATE NORMALIZED DA/PLATE hostile SDK acceptance (expected RED until server-fixed)
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-preseal-real-identity-redteam.mjs"
