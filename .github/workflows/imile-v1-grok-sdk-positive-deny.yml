name: iMile V1 #184 exact-head Grok SDK denial + legitimate positive controls
on:
  pull_request:
    paths:
      - 'tools/v1-attestation-sdk-probes.mjs'
      - 'staging/imile-management/fleet/v1-attestation-sdk-probes.mjs'
      - '.github/workflows/imile-v1-grok-sdk-positive-deny.yml'
permissions:
  contents: read
jobs:
  real-rules-sdk-positive-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Locked local Firebase SDK install
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Original FULL restricted Rules signed-in SDK ALLOW + DENY + readback
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.depo-qa.json \
            "node tools/v1-attestation-sdk-probes.mjs"
      - name: State limitations explicitly
        run: echo "Local emulator tests only; NOT production privileged importer/IAM, live migration or GO"
