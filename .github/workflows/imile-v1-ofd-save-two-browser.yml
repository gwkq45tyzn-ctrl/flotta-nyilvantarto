name: iMile V1 #156 OFD Firestore save two-browser QA
on:
  pull_request:
    paths:
      - 'staging/imile-management/fleet/v1-ofd-save-two-browser.e2e.mjs'
      - 'staging/imile-management/reports/report-app.mjs'
      - 'staging/imile-management/reports/report-core.mjs'
      - 'staging/imile-management/reports/report-statistics.mjs'
      - 'depokapacitas/firestore-v1-restricted.rules'
      - '.github/workflows/imile-v1-ofd-save-two-browser.yml'
permissions:
  contents: read
jobs:
  ofd-save:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK and free Chromium
        run: |
          npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
          npm install --prefix staging/imile-management/fleet --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.0
          ./staging/imile-management/fleet/node_modules/.bin/playwright install --with-deps chromium
      - name: Two browsers save and read OFD under original Rules
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-ofd-save-two-browser.e2e.mjs"
