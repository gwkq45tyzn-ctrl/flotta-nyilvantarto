name: iMile V1 – P0 original #133 SDK replay with keyed masters present
on:
  pull_request:
    paths:
      - 'depokapacitas/firestore-v1-restricted.rules'
      - 'staging/imile-management/fleet/v1-keyed-master-133-replay-emulator.mjs'
      - '.github/workflows/imile-v1-keyed-133-p0.yml'
permissions:
  contents: read
jobs:
  actual-full-rules-original-five:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firestore test SDK
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Real Firestore Emulator – all five hostile SDK cases MUST DENY on actual Rules
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-keyed-master-133-replay-emulator.mjs"
      - name: No live deployment or production data
        run: echo 'Synthetic local emulator only; release GO requires independent full tests.'
