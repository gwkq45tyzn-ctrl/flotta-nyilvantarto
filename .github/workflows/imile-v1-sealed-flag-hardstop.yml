name: iMile V1 – P0 immutable sealed migration, no SDK unseal
on:
  pull_request:
    paths:
      - 'depokapacitas/firestore-v1-restricted.rules'
      - 'staging/imile-management/fleet/v1-sealed-flag-direct-sdk-emulator.mjs'
      - '.github/workflows/imile-v1-sealed-flag-hardstop.yml'
permissions:
  contents: read
jobs:
  real-rules-seal-red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned synthetic-test SDK
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Real full restricted Rules – refuse unseal/self-seal/duplicate and allow original pre-cutover save
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-sealed-flag-direct-sdk-emulator.mjs"
      - name: Synthetic QA no deploy
        run: echo 'No production writes or main merge; this is not GO.'
