name: iMile V1 real 12-14 original Rules booking QA
on:
  pull_request:
    paths:
      - 'staging/imile-management/fleet/v1-12-14-original-rules.e2e.mjs'
      - 'tools/v1-migration-dryrun.mjs'
      - 'depokapacitas/firestore-v1-restricted.rules'
      - '.github/workflows/imile-v1-12-14-original-rules.yml'
permissions:
  contents: read
jobs:
  real-original-rules-local-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install existing pinned emulator SDK dependencies
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Actual original restricted Rules, 12+14 rich source, full backup and real positive/negative bookings
        run: |
          git rev-parse HEAD
          node --check staging/imile-management/fleet/v1-12-14-original-rules.e2e.mjs
          npx --yes firebase-tools@15.34.2 emulators:exec --only firestore --config firebase.staging-emulator.json --project demo-imile-restricted-v1 "node staging/imile-management/fleet/v1-12-14-original-rules.e2e.mjs"
      - name: P0 policy reminder
        run: echo 'LOCAL SYNTHETIC fixture only. Original privileged poisoning P0 remains independently RED. NO production authority.'
