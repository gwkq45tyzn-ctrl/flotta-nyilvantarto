name: iMile V1 #183 – exact-head original Fleet to Depot Chromium regression
on:
  pull_request:
    paths:
      - 'tools/v1-migration-dryrun.mjs'
      - 'tools/v1-migration-acceptance.test.mjs'
      - 'staging/imile-management/fleet/v1-canonical-booking-emulator.mjs'
      - '.github/workflows/imile-v1-source-index-original-e2e.yml'
permissions:
  contents: read
jobs:
  actual-original-two-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Check out exact PR head SHA (not earlier green ancestor)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Original full Fleet file pin and local-only controls
        run: |
          test "$(git rev-parse HEAD:index.html)" = "00773451fbe2d8c23046d195f5d707efd46b3700"
          echo "Testing exact PR HEAD $(git rev-parse HEAD), local emulator only"
      - name: Install lockfile-pinned Firebase and free test-only Chromium
        run: |
          npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
          npm install --prefix staging/imile-management/fleet --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.0
          ./staging/imile-management/fleet/node_modules/.bin/playwright install --with-deps chromium
      - name: Original Flotta to Depo booking and projection, two real Chromium contexts
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-flotta-depo-e2e.mjs"
      - name: Post-import original HTML and live keyed driver/car masters
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-post-import-two-browser.e2e.mjs"
      - name: Actual second browser + authenticated Depot sync
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-two-browser-emulator.e2e.mjs"
      - name: Original Fleet HTML rejects hostile legacy session
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-original-fleet-browser.e2e.mjs"
      - name: Assert test-only execution
        run: echo "No Firebase deploy, main merge, real UID, production credentials, or paid cloud dependencies"
