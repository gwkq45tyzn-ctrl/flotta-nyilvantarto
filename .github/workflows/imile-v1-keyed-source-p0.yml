name: iMile V1 – P0 keyed canonical source loss and bootstrap acceptance
on:
  pull_request:
    paths:
      - 'depokapacitas/canonical-booking-transaction.mjs'
      - 'depokapacitas/firestore-v1-restricted.rules'
      - 'staging/imile-management/fleet/v1-keyed-source-booking-p0-emulator.mjs'
      - '.github/workflows/imile-v1-keyed-source-p0.yml'
permissions:
  contents: read
jobs:
  keyed-source-hard-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install lockfile-pinned SDK for local Firestore emulator
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Test real booking and restricted Rules against original keyed master corruption
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-keyed-source-booking-p0-emulator.mjs"
      - name: No real data, Rules publish or deployment
        run: echo 'Local synthetic data only. A future green result does not authorize production.'
