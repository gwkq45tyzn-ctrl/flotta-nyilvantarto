name: iMile V1 #185 real 440-record local Firestore migration scale
on:
  pull_request:
    paths:
      - 'staging/imile-management/fleet/v1-large-batch-drill.mjs'
      - '.github/workflows/imile-v1-large-scale-migration.yml'
permissions:
  contents: read
jobs:
  large-synthetic-interrupted-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Existing immutable SDK lockfile (no production resources)
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: 440 rich records, 48-record batches, crash/resume/rollback, forged checkpoint, seal and SDK size
        run: |
          node --check staging/imile-management/fleet/v1-large-batch-drill.mjs
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-v1-scale \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-large-batch-drill.mjs"
      - name: Scope
        run: echo "Local emulator synthetic only - production IAM, real wire size and live migration are not verified"
