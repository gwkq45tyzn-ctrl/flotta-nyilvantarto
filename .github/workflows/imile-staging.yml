name: iMile Management – staging-only integration tests

on:
  push:
    branches: ['staging/imile-management-integration']
    paths:
      - 'staging/imile-management/**'
      - 'depokapacitas/**'
      - '.github/workflows/imile-staging.yml'
  pull_request:
    paths:
      - 'staging/imile-management/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Staging – offline schema and web checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Staging Firebase webkonfiguráció ellenőrzése
        run: node depokapacitas/firebase-config.test.mjs
      - name: Kötelező fájlok és Firebase klienskód ellenőrzése
        run: node depokapacitas/tests/check.mjs
      - name: Közös futár/autó törzs és duplikációs tesztek
        run: node staging/imile-management/shared-records.test.mjs
      - name: Közös adatbázis-összehasonlítás tesztelése
        run: node staging/imile-management/shared-import-plan.test.mjs
      - name: Szervizben lévő autók és inaktív futárok kizárása
        run: node depokapacitas/capacity-eligibility.test.mjs
      - name: Magyar, amerikai és Excel-dátumok tesztelése
        run: node depokapacitas/import-dates.test.mjs
      - name: Magyar CSV karakterkódolások ellenőrzése
        run: node depokapacitas/import-encoding.test.mjs
      - name: Importelőellenőrzés és duplikált rekordok tesztje
        run: node depokapacitas/import-validation.test.mjs
      - name: Google Attendance időpontok ellenőrzése
        run: node depokapacitas/google-sync/timestamp.test.mjs
      - name: Firestore szabályok kódszintű biztonsági ellenőrzése
        run: node depokapacitas/rules-contract.test.mjs
      - name: Naptári dátumok és Attendance időpontok validálása
        run: node depokapacitas/rules-calendar.test.mjs
      - name: Szintetikus kapacitás-, foglalás- és visszavonási tesztek
        run: |
          node staging/imile-management/qa/functional-flow.test.mjs
          node staging/imile-management/qa/run-flow.test.mjs
      - name: Közös Flotta-törzs létrehozásának és szerkesztésének tesztje
        run: |
          node staging/imile-management/fleet/master-data.test.mjs
          node staging/imile-management/fleet/master-editor.test.mjs
          node staging/imile-management/fleet/shared-capacity.integration.test.mjs
          node staging/imile-management/fleet/operations.test.mjs
      - name: Attendance-alapú automatikus autókiadás és visszavétel ellenőrzése
        run: |
          node staging/imile-management/attendance-handover.test.mjs
          node staging/imile-management/attendance-integration.test.mjs
      - name: Közös belépés és izolált preview tesztje
        run: |
          node staging/imile-management/session-policy.test.mjs
          node staging/imile-management/entry.test.mjs
      - name: Fejlesztői JavaScript modulok ellenőrzése
        run: |
          node --check staging/imile-management/shared-records.mjs
          node --check staging/imile-management/shared-import-plan.mjs
          node --check staging/imile-management/fleet/master-data.mjs
          node --check staging/imile-management/fleet/master-editor.mjs
          node --check staging/imile-management/fleet/app.mjs
      - name: Staging kiadási tiltások és Hosting preview-szabályok
        run: node staging/imile-management/deploy-policy.test.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore jogosultságok – izolált flottatesztek
        run: |
          npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
          npx --yes firebase-tools@15.34.2 emulators:exec --only firestore --project demo-imile-fleet --config firebase.staging-emulator.json "node staging/imile-management/fleet/rules-emulator.mjs"
      - name: A flotta belépési pontjának érintetlensége
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git diff --exit-code origin/main -- index.html

      - name: Izolált, letölthető staging webcsomag építése
        run: node staging/imile-management/build-preview.mjs
      - name: Ellenőrzött staging webcsomag archiválása
        uses: actions/upload-artifact@v4
        with:
          name: imile-staging-preview
          path: preview-imile-staging/
          if-no-files-found: error
          retention-days: 7
      - name: Staging Firebase Hosting feltételeinek ellenőrzése
        id: hosting_permission
        env:
          FIREBASE_HOSTING_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMILE_MANAGEMENT_STAGING }}
        run: |
          if [ -n "$FIREBASE_HOSTING_SA" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Firebase Hosting: biztonságos staging preview telepítés engedélyezhető." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Firebase Hosting: a GitHub staging service-account secret hiányzik, csak ellenőrzött preview artifact készült. Semmilyen éles telepítés nem történt." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Firebase Hosting előnézet publikálása – csak staging csatorna
        if: github.event_name == 'push' && steps.hosting_permission.outputs.enabled == 'true'
        id: deploy_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMILE_MANAGEMENT_STAGING }}
          projectId: imile-management-staging
          channelId: imile-qa
          expires: 7d
          entryPoint: preview-imile-staging
      - name: Hosting preview elérhetőségének megjelenítése
        if: steps.deploy_preview.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.details_url }}
        run: |
          echo "### iMile Management staging preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
