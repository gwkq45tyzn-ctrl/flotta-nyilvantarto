name: iMile V1 – P0/P1 post-seal keyed eligibility authorization
on:
  pull_request:
    paths:
      - 'depokapacitas/canonical-booking-transaction.mjs'
      - 'depokapacitas/firestore-v1-restricted.rules'
      - 'staging/imile-management/fleet/v1-post-seal-keyed-eligibility-emulator.mjs'
      - '.github/workflows/imile-v1-keyed-eligibility-p0.yml'
permissions:
  contents: read
jobs:
  real-keyed-authority-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned local-emulator SDK
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Real full Firestore Rules – keyed car service MUST DENY; keyed driver capacity edit MUST book
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-post-seal-keyed-eligibility-emulator.mjs"
      - name: No deployment
        run: echo 'Synthetic emulator only; not production release authority.'
