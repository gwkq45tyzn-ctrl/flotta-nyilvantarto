name: iMile V1 – P0 actual Rules forged counter direct SDK acceptance
on:
  pull_request:
    paths:
      - 'depokapacitas/firestore-v1-restricted.rules'
      - 'staging/imile-management/fleet/v1-counter-map-present-p0-emulator.mjs'
      - '.github/workflows/imile-v1-counter-map-p0-acceptance.yml'
permissions:
  contents: read
jobs:
  actual-rules-p0-deny-required:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install lockfile-pinned emulator SDK
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: All hostile direct SDK duplicate writes MUST DENY on actual restricted Rules
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-counter-map-present-p0-emulator.mjs"
      - name: No source or production changes
        run: echo 'Synthetic QA only, no deployment. A passing test still needs full V1 evidence.'
