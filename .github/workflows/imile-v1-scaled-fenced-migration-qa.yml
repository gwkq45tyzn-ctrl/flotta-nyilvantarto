name: iMile V1 #216 genuinely scaled epoch-fenced rich migration and recovery
on:
  pull_request:
    paths:
      - 'tools/v1-scaled-fenced-migration.test.mjs'
      - 'staging/imile-management/fleet/v1-scaled-fenced-rich-migration.test.mjs'
      - 'staging/imile-management/fleet/v1-demo-manual-preseal-recovery.mjs'
      - '.github/workflows/imile-v1-scaled-fenced-migration-qa.yml'
permissions:
  contents: read
jobs:
  actual-180-rich-masters-180-claims-and-bounded-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned local Firestore SDK tools
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Actual original Firestore Rules + no-skip full-rich synthetic SDK batch, manual rollback and stale epochs
        run: |
          git rev-parse HEAD
          node --check staging/imile-management/fleet/v1-demo-manual-preseal-recovery.mjs
          node --check staging/imile-management/fleet/v1-scaled-fenced-rich-migration.test.mjs
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-v1-scaled-rich \
            --config firebase.depo-qa.json \
            "node --test tools/v1-scaled-fenced-migration.test.mjs"
      - name: No privileged release authority
        run: echo "180 synthetic rich masters+180 claims DEMO only. No actual source signer, service identity/IAM, unattended crash recovery or seal. FULL V1 NO-GO."
