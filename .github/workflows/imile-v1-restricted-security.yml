name: iMile V1 – restricted one-account Rules and migration QA
on:
  push:
    branches: ['integration/v1-security-restricted-20261103']
    paths:
      - 'depokapacitas/firestore-v1-restricted.rules'
      - 'staging/imile-management/fleet/v1-restricted-rules-emulator.mjs'
      - 'features/migration-manifest*'
      - 'features/fleet-migration-dryrun*'
      - 'depokapacitas/app.js'
      - 'depokapacitas/index.html'
      - 'depokapacitas/v1-single-account-ui.test.mjs'
      - '.github/workflows/imile-v1-restricted-security.yml'
  pull_request:
    paths:
      - 'depokapacitas/firestore-v1-restricted.rules'
      - 'staging/imile-management/fleet/v1-restricted-rules-emulator.mjs'
      - 'features/migration-manifest*'
      - 'features/fleet-migration-dryrun*'
      - 'depokapacitas/app.js'
      - 'depokapacitas/index.html'
      - 'depokapacitas/v1-single-account-ui.test.mjs'
      - '.github/workflows/imile-v1-restricted-security.yml'
permissions:
  contents: read
jobs:
  v1-security:
    runs-on: ubuntu-latest
    name: Emulated V1 single-UID + source-manifest guarantees
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify offline source manifest nested SHA-256 and size gate
        run: node features/migration-manifest.test.mjs
      - name: Offline legacy/local/pending/backup reconciliation scenarios
        run: node features/fleet-migration-dryrun.test.mjs
      - name: Check V1 single-account UI and removal of user CRUD
        run: node depokapacitas/v1-single-account-ui.test.mjs
      - name: Install lockfile-pinned Firestore rule test dependencies
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Actual Firestore Emulator – allowed single UID and deny all other roles
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-restricted-rules-emulator.mjs"
      - name: Protect active staging Rules and actual original Fleet
        run: |
          test "$(git rev-parse HEAD:depokapacitas/firestore.rules)" = "0b9eba640f1ccdf33c92100d90205753548f6bb3"
          test "$(git rev-parse HEAD:index.html)" = "4d51c5ff768fc7fb27480ba19fc6eac9a1d11e88"
