name: iMile V1 – #133 P0 FULL atomic booking forged index RED TEAM
on:
  pull_request:
    paths:
      - 'staging/imile-management/fleet/v1-full-atomic-booking-index-redteam.mjs'
      - 'staging/imile-management/fleet/v1-booking-index-forgery-emulator.mjs'
      - 'depokapacitas/firestore-v1-restricted.rules'
      - '.github/workflows/imile-v1-booking-index-full-atomic-redteam.yml'
permissions:
  contents: read
jobs:
  signed-in-full-atomic-booking:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Actual source syntax, no static-only proof
        run: |
          node --check staging/imile-management/fleet/v1-full-atomic-booking-index-redteam.mjs
          node --check staging/imile-management/fleet/v1-booking-index-forgery-emulator.mjs
      - name: Install lockfile-pinned emulator SDK dependencies
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: P0 signed-in SDK complete booking + ALL claims, unique positive, duplicated privileged source hostile cases
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-full-atomic-booking-index-redteam.mjs"
      - name: No production deploy or IAM/UID change
        run: echo "Only local demo project test; expected RED on vulnerability"
