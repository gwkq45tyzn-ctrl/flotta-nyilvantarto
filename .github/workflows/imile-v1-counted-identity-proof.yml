name: iMile V1 – trusted empty-base counted identity feasibility (ISOLATED)
on:
  pull_request:
    paths:
      - 'staging/imile-management/fleet/v1-counted-identity-induction.rules'
      - 'staging/imile-management/fleet/v1-counted-identity-induction-emulator.mjs'
      - '.github/workflows/imile-v1-counted-identity-proof.yml'
permissions:
  contents: read
jobs:
  actual-local-firestore-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned emulator-test SDK
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Prove DA+plate single-entry counter invariants on local Firebase Rules
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-counted-identity-induction-emulator.mjs"
      - name: No release or deployment in this proof
        run: echo 'This proves isolated semantics only. NOT actual iMile Rules, migration, original UI or GO.'
