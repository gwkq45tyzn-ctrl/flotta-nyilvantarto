name: iMile V1 integrated same-SHA acceptance / P0 fail-closed
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'docs/**'
      - 'staging/imile-management/fleet/**'
      - 'depokapacitas/**'
      - 'features/**'
      - '.github/workflows/imile-v1-consolidated-qa.yml'
permissions:
  contents: read
jobs:
  offline-manifest-size-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pin exact unmerged source HEAD
        run: git rev-parse HEAD
      - name: Full-rich offline importer / strict Firestore size / Apps Script evidence
        run: |
          node --test \
            tools/v1-migration-dryrun.test.mjs \
            tools/v1-migration-acceptance.test.mjs \
            tools/v1-trusted-importer-attestation.test.mjs \
            tools/v1-firestore-size-gate.test.mjs \
            tools/v1-firestore-size-estimator.test.mjs \
            docs/v1-apps-script-inventory-static.test.mjs
  signed-in-restricted-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned local SDKs
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Real signed-in privileged-seeded synthetic Rules positive and negative
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.depo-qa.json \
            "node tools/v1-attestation-sdk-probes.mjs"
      - name: Canonical booking and real full restricted Rules positive/negative
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-canonical-booking-emulator.mjs"
  actual-original-fleet-depo-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Assert unchanged actual original full Fleet HTML
        run: test "$(git rev-parse HEAD:index.html)" = "00773451fbe2d8c23046d195f5d707efd46b3700"
      - name: Free local browser & pinned Firebase dependencies
        run: |
          npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
          npm install --prefix staging/imile-management/fleet --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.0
          ./staging/imile-management/fleet/node_modules/.bin/playwright install --with-deps chromium
      - name: Original Fleet to Depot, genuine app, authenticated full E2E
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-flotta-depo-e2e.mjs"
      - name: Original HTML readback after privileged synthetic seal
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-post-import-two-browser.e2e.mjs"
      - name: Second browser and original signed-in Depot
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-two-browser-emulator.e2e.mjs"
      - name: Original Fleet legacy browser fail-closed behavior
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-original-fleet-browser.e2e.mjs"
  p0-poisoned-privileged-source-hardstop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned local SDK
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: P0 acceptance MUST fail while poisoned privileged-sealed source permits forged booking
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-forged-booking-index-probes.mjs"
      - name: Never claim whole V1 GO without passing this gate
        run: echo "Full V1 release requires independent GO from Grok and ChatGPT on same SHA and user sign-off"
