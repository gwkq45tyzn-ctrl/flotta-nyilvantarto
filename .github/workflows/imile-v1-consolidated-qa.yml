name: iMile V1 integrated same-SHA acceptance / P0 fail-closed
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'docs/**'
      - 'staging/imile-management/fleet/**'
      - 'staging/imile-management/central-alerts.*'
      - 'staging/imile-management/build-preview.mjs'
      - 'staging/imile-management/build-v1-core.mjs'
      - 'staging/imile-management/build-v1-core.test.mjs'
      - 'staging/imile-management/core-preview-scope.test.mjs'
      - 'staging/imile-management/index.html'
      - 'depokapacitas/**'
      - 'features/**'
      - '.github/workflows/imile-v1-consolidated-qa.yml'
permissions:
  contents: read
jobs:
  offline-manifest-size-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pin exact unmerged source HEAD
        run: git rev-parse HEAD
      - name: Phase-1 Fleet+Depot CORE-only bundle boundary
        run: node --test staging/imile-management/core-preview-scope.test.mjs
      - name: Original rich Fleet HTML mandatory oil-change km warning regression
        run: node --test staging/imile-management/fleet/v1-original-mileage-alerts.test.mjs
      - name: Original full-rich four-array JSON import cancel and safe migration hardstop
        run: node --test staging/imile-management/fleet/v1-original-rich-import.test.mjs
      - name: Read-only central Fleet overdue oil-change km and shared Depot alert integration
        run: |
          node staging/imile-management/central-alerts.test.mjs
          node staging/imile-management/central-alerts.integration.test.mjs
          node --test depokapacitas/keyed-live-master.test.mjs
      - name: Read-only source SHA-256 evidence and adversarial integrity tests
        run: |
          node --test tools/v1-release-fingerprint.test.mjs
          node tools/v1-release-fingerprint.mjs
      - name: Full V1 module contract cannot be narrowed to Fleet+Depot
        run: |
          node --test tools/v1-release-full-scope-gate.test.mjs
          node tools/v1-release-full-scope-gate.mjs
      - name: Complete core offline regressions, including historical S7 contracts
        run: node tools/v1-core-regression-suite.mjs offline
      - name: Full-rich offline importer / strict Firestore size / Apps Script evidence
        run: |
          node --test \
            tools/v1-migration-dryrun.test.mjs \
            tools/v1-migration-dryrun-cli-redaction.test.mjs \
            tools/v1-private-utf8-read.test.mjs \
            tools/v1-private-owner-file-boundary-integration.test.mjs \
            tools/v1-migration-acceptance.test.mjs \
            tools/v1-pinned-backup-trust.test.mjs \
            tools/v1-private-attestation-denial-redaction.test.mjs \
            tools/v1-operational-readiness.test.mjs \
            tools/v1-atomic-migration-budget.test.mjs \
            tools/v1-owner-readiness-cli.test.mjs \
            tools/v1-capacity-remediation.test.mjs \
            tools/v1-trusted-importer-attestation.test.mjs \
            tools/v1-firestore-size-gate.test.mjs \
            tools/v1-firestore-size-estimator.test.mjs \
            tools/v1-apps-script-cutover-evidence.test.mjs \
            tools/v1-apps-script-cutover-cli.test.mjs \
            tools/v1-source-cutover-bound-preflight.test.mjs \
            tools/v1-private-appstate-double-readback.test.mjs \
            tools/v1-private-capacity-transition.test.mjs \
            tools/v1-owner-capacity-review.static.test.mjs \
            docs/v1-apps-script-inventory-static.test.mjs
  signed-in-restricted-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned local SDKs
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Private owner four-array Firestore proto size preflight (offline SDK, no network)
        run: |
          node --test staging/imile-management/fleet/v1-firestore-wire-size.test.mjs \
            staging/imile-management/fleet/v1-private-proto-preflight.test.mjs
      - name: Real signed-in privileged-seeded synthetic Rules positive and negative
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.depo-qa.json \
            "node tools/v1-attestation-sdk-probes.mjs"
      - name: Canonical booking and real full restricted Rules positive/negative
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-canonical-booking-emulator.mjs"
      - name: Mandatory signed-registry highwater redaction and genuine 3-OS-process rollback test
        run: |
          node --check staging/imile-management/fleet/v1-local-durable-signed-registry.mjs
          node --check staging/imile-management/fleet/v1-local-durable-signed-registry.test.mjs
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-v1-registry-highwater \
            --config firebase.depo-qa.json \
            "node --test staging/imile-management/fleet/v1-local-durable-signed-registry.test.mjs"
  actual-original-fleet-depo-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Assert unchanged actual original full Fleet HTML
        run: test "$(git rev-parse HEAD:index.html)" = "acf57b157804ee9b14026ef388c0a354d66e517f"
      - name: Free local browser & pinned Firebase dependencies
        run: |
          npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
          npm install --prefix staging/imile-management/fleet --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.0
          ./staging/imile-management/fleet/node_modules/.bin/playwright install --with-deps chromium
      - name: Build and verify exact emitted original Fleet+Depot QA bundle (BLOCKED)
        run: |
          node --test staging/imile-management/build-v1-core.test.mjs
          node staging/imile-management/build-v1-core.mjs
      - name: Original Fleet to Depot, genuine app, authenticated full E2E
        run: |
          node --test staging/imile-management/fleet/v1-qa-asset-routes.test.mjs
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-flotta-depo-e2e.mjs"
      - name: Actual byte-hashed Fleet+Depot QA artifact - authenticated 2-browser E2E
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "IMILE_CORE_ARTIFACT=1 node staging/imile-management/fleet/v1-flotta-depo-e2e.mjs"
      - name: Original HTML readback after privileged synthetic seal
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-post-import-two-browser.e2e.mjs"
      - name: Second browser and original signed-in Depot
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-two-browser-emulator.e2e.mjs"
      - name: Original Fleet legacy browser fail-closed behavior
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only auth,firestore --project demo-imile-qa \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-original-fleet-browser.e2e.mjs"
      - name: Offline owner four-array capacity review in real Chromium (NO CLOUD)
        run: |
          node tools/v1-owner-capacity-review.e2e.mjs
  p0-poisoned-privileged-source-hardstop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned local SDK
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: P0 acceptance MUST fail while poisoned privileged-sealed source permits forged booking
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-restricted-v1 \
            --config firebase.depo-qa.json \
            "node staging/imile-management/fleet/v1-forged-booking-index-probes.mjs"
      - name: Never claim whole V1 GO without passing this gate
        run: echo "Full V1 release requires independent GO from Grok and ChatGPT on same SHA and user sign-off"

  complete-core-emulator-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned local SDKs
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Required genuine rich readback, 440-record rollback and separate-process stale writer tests
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-core-regressions \
            --config firebase.staging-emulator.json \
            "node tools/v1-core-regression-suite.mjs emulator"
      - name: Required variable-block rich roundtrip and interrupted rollback on identical SHA
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-v1-variable-blocks \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-variable-block-migration-drill.mjs"
      - name: Required saved-file backup recovery on identical SHA
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-migration \
            --config firebase.staging-emulator.json \
            "node tools/v1-migration-emulator-drill.mjs"
