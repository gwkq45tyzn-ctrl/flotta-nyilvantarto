name: iMile V1 #185 variable four-block migration rollback
on:
  pull_request:
    paths:
      - 'staging/imile-management/fleet/v1-firestore-wire-size*'
      - 'staging/imile-management/fleet/package*.json'
      - 'features/v1-fleet-source-remediation.mjs'
      - 'features/v1-fleet-source-remediation.test.mjs'
      - 'tools/v1-fleet-remediation-cli.mjs'
      - 'tools/v1-fleet-remediation-cli.test.mjs'
      - 'tools/v1-variable-block-migration.mjs'
      - 'tools/v1-variable-block-migration.test.mjs'
      - 'tools/v1-migration-dryrun.mjs'
      - 'tools/v1-firestore-size-gate.mjs'
      - 'staging/imile-management/fleet/v1-variable-block-migration-drill.mjs'
      - '.github/workflows/imile-v1-variable-block-migration.yml'
permissions:
  contents: read
jobs:
  variable-blocks-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned emulator SDK
        run: npm ci --prefix staging/imile-management/fleet --ignore-scripts --no-audit --no-fund
      - name: Offline positive and negative migration checks
        run: |
          git rev-parse HEAD
          node --test features/v1-fleet-source-remediation.test.mjs \
            tools/v1-fleet-remediation-cli.test.mjs \
            staging/imile-management/fleet/v1-firestore-wire-size.test.mjs \
            tools/v1-variable-block-migration.test.mjs \
            tools/v1-migration-dryrun.test.mjs \
            tools/v1-firestore-size-gate.test.mjs
      - name: Emulator interrupted 12/14/14/5 and larger unequal source
        run: |
          node --check staging/imile-management/fleet/v1-variable-block-migration-drill.mjs
          npx --yes firebase-tools@15.34.2 emulators:exec \
            --only firestore --project demo-imile-v1-variable-blocks \
            --config firebase.staging-emulator.json \
            "node staging/imile-management/fleet/v1-variable-block-migration-drill.mjs"
      - name: Scope
        run: echo "Synthetic emulator only. Measures v1 Document protobufs for the synthetic source, masters and claims. No production approval, seal, or import authority."
